services:
  rustdesk-api:
    build: .
    image: rustdesk-api-go:latest
    container_name: rustdesk-api
    ports:
      - "21114:21114"
    environment:
      - TZ=Asia/Shanghai
      - DB_URL=/data/rustdesk-api.db
      # 是否允许网页自助注册（关闭后只能由管理员建号）
      - ALLOW_REGISTRATION=true
      # 初始管理员：仅当数据库为空时生效
      - ADMIN_USER=admin
      - ADMIN_PASS=change-me-please
      # Web 控制端使用的 ID 服务器地址（多个用逗号分隔；留空则取请求主机）
      # - ID_SERVER=yourdomain.com
    volumes:
      - ./data:/data
      # 可选：挂载 Flutter 编译产物启用 /webui 网页控制端
      # - ./webui-dist:/webui-dist:ro
    restart: unless-stopped

# 典型拓扑：本服务与 hbbs/hbbr 并列部署，客户端 API 地址指向本服务。
#   hbbs  21115/21116/21118（ID/信令）
#   hbbr  21117/21119（中继）
#   api   21114（本服务：登录/心跳/地址簿/资产/管理后台）
