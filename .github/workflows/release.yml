name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: test
        run: go test ./...

      - name: build release artifacts
        run: |
          chmod +x packaging/build-release.sh
          ./packaging/build-release.sh "${GITHUB_REF_NAME}"

      - name: upload linux/mac/exe release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ github.ref_name }}/*

  msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Install WiX toolset v4
        run: dotnet tool install --global wix --version 4.0.5

      - name: Build Agent Windows Binary
        shell: bash
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o bin/prism-agent.exe ./cmd/agent

      - name: Build MSI with WiX
        shell: pwsh
        run: |
          $sourceExe = (Resolve-Path "bin/prism-agent.exe").Path
          wix build packaging/agent/wix/Package.wxs -d AgentSourceExe="$sourceExe" -o bin/PrismAgent.msi

      - name: Upload MSI to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: bin/PrismAgent.msi

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: lowercase image name (ghcr.io requires lowercase)
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:latest
